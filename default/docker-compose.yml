version: '3.8'

x-airflow-common: &airflow-common
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mcp-https-forwarder:
      condition: service_started
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /app/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /app/simple_auth_manager_passwords.json.generated
    # Critical for Airflow 3 + Docker: scheduler/workers must reach the api-server
    # container, not localhost (which would point at themselves).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-commodity-sample-jwt-secret}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
    ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
    ALPHA_VANTAGE_INTERVAL: ${ALPHA_VANTAGE_INTERVAL:-monthly}
    ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS: ${ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS:-15}
    # MCP connection: http (default Streamable HTTP), sse, stdio, or rest (legacy REST).
    # Docs: https://mcp.alphavantage.co/#connection-examples
    ALPHA_VANTAGE_TRANSPORT: ${ALPHA_VANTAGE_TRANSPORT:-http}
    # TLS to MCP goes through mcp-https-forwarder on the host network (port 18080).
    # extra_hosts keeps the certificate hostname mcp.alphavantage.co while TCP
    # lands on the host, which can reach the internet when the compose bridge cannot.
    ALPHA_VANTAGE_MCP_URL: ${ALPHA_VANTAGE_MCP_URL:-https://mcp.alphavantage.co:18080/mcp}
    ALPHA_VANTAGE_MCP_SSE_URL: ${ALPHA_VANTAGE_MCP_SSE_URL:-https://mcp.alphavantage.co:18080/sse}
    ALPHA_VANTAGE_MCP_STDIO_COMMAND: ${ALPHA_VANTAGE_MCP_STDIO_COMMAND:-uvx}
    ALPHA_VANTAGE_MCP_STDIO_ARGS: ${ALPHA_VANTAGE_MCP_STDIO_ARGS:-marketdata-mcp-server}
  extra_hosts:
    - "mcp.alphavantage.co:host-gateway"
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/app/dags
    - ./logs:/app/logs

services:
  # Host-network TLS forwarder so Airflow workers can reach Alpha Vantage MCP
  # when the compose bridge cannot SNAT to the public internet (common on
  # nested/CI VMs). Docker Desktop for Mac/Windows does not support host
  # networking: set ALPHA_VANTAGE_MCP_URL=https://mcp.alphavantage.co/mcp
  # (and the SSE URL without :18080) so workers talk to Cloudflare directly.
  mcp-https-forwarder:
    image: alpine/socat:1.8.0.3
    network_mode: host
    restart: unless-stopped
    command: ["TCP-LISTEN:18080,fork,reuseaddr", "TCP:mcp.alphavantage.co:443"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-api-server:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: airflow api-server --port 8080

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor

volumes:
  postgres_data:
