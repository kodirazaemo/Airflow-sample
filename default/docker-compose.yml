version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW_DATABASE_HOST: postgres
      AIRFLOW_DATABASE_USER: airflow
      AIRFLOW_DATABASE_PASSWORD: airflow
      AIRFLOW_DATABASE_DB: airflow
      AIRFLOW_EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
      ALPHA_VANTAGE_INTERVAL: ${ALPHA_VANTAGE_INTERVAL:-monthly}
      ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS: ${ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS:-15}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/app/dags
      - ./logs:/app/logs
    command: airflow webserver --port 8080

  airflow-scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW_DATABASE_HOST: postgres
      AIRFLOW_DATABASE_USER: airflow
      AIRFLOW_DATABASE_PASSWORD: airflow
      AIRFLOW_DATABASE_DB: airflow
      AIRFLOW_EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
      ALPHA_VANTAGE_INTERVAL: ${ALPHA_VANTAGE_INTERVAL:-monthly}
      ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS: ${ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS:-15}
    volumes:
      - ./dags:/app/dags
      - ./logs:/app/logs
    command: airflow scheduler

volumes:
  postgres_data:
