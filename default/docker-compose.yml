version: '3.8'

x-airflow-common: &airflow-common
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /app/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /app/simple_auth_manager_passwords.json.generated
    # Critical for Airflow 3 + Docker: scheduler/workers must reach the api-server
    # container, not localhost (which would point at themselves).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-commodity-sample-jwt-secret}
    # Shared Fernet key so Connection passwords decrypt on every service.
    # Local-only default; override in production / secrets backend.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-55ir7VFGb59SQmx1wFDA7e-SOCPAIoSAk6_5EaF83xw=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
    ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
    ALPHA_VANTAGE_INTERVAL: ${ALPHA_VANTAGE_INTERVAL:-monthly}
    ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS: ${ALPHA_VANTAGE_REQUEST_PAUSE_SECONDS:-15}
    # MCP connection: http (default Streamable HTTP), sse, stdio, or rest (legacy REST).
    # Docs: https://mcp.alphavantage.co/#connection-examples
    ALPHA_VANTAGE_TRANSPORT: ${ALPHA_VANTAGE_TRANSPORT:-http}
    # Direct MCP (Docker Desktop / WSL / typical internet SNAT). Do not point
    # mcp.alphavantage.co at host-gateway here — that breaks Desktop.
    # Host-network :18080 forwarder is opt-in: docker-compose.mcp-forwarder.yml
    ALPHA_VANTAGE_MCP_URL: ${ALPHA_VANTAGE_MCP_URL:-https://mcp.alphavantage.co/mcp}
    ALPHA_VANTAGE_MCP_SSE_URL: ${ALPHA_VANTAGE_MCP_SSE_URL:-https://mcp.alphavantage.co/sse}
    ALPHA_VANTAGE_MCP_STDIO_COMMAND: ${ALPHA_VANTAGE_MCP_STDIO_COMMAND:-uvx}
    ALPHA_VANTAGE_MCP_STDIO_ARGS: ${ALPHA_VANTAGE_MCP_STDIO_ARGS:-marketdata-mcp-server}
    MEDALLION_DATA_DIR: /app/data/medallion
    AIRFLOW__CORE__PLUGINS_FOLDER: /app/plugins
    PYTHONPATH: /app/dags:/app/plugins
  volumes:
    - ./dags:/app/dags
    - ./plugins:/app/plugins
    - ./logs:/app/logs
    - ./data:/app/data

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-api-server:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: airflow api-server --port 8080

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor

volumes:
  postgres_data:
